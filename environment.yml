# Full pinned stack for the comparative study (CPU; GPU is auto-detected if present).
# Usage: mamba env create -f environment.yml && conda activate dl-scrna
name: dl-scrna
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.9
  - pytorch=2.5.1
  - pytorch_geometric=2.6.1
  - scikit-learn=1.5.2
  - scanpy=1.10.4
  - celltypist=1.6.3
  - leidenalg=0.10.2
  - python-igraph=0.11.8
  - anndata=0.10.9
  - numpy=1.26.4
  - pandas=2.2.3
  - matplotlib=3.9.2
  - seaborn=0.13.2
  - umap-learn=0.5.6
  - pyyaml=6.0.2
